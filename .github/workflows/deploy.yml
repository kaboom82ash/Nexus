name: Deploy to GitHub Pages

on:
  # Deploy on pushes to these branches so you can preview the app live.
  push:
    branches:
      - main
      - claude/live-dashboard-widgets-24mazs
      - claude/weekly-briefing-homepage-a0o51r
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Permissions required for GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Google OAuth client id lives in .env.production (it is a public
      # browser credential, guarded by its Authorized JavaScript origins).
      # Do NOT pass VITE_GOOGLE_CLIENT_ID from a secret here: an unset secret
      # renders as an empty string, and an existing env var outranks the
      # .env file in Vite — which silently drops the deployed site back to
      # sample-data mode.
      - name: Build
        run: npm run build

      - name: Setup Pages
        # Requires Pages to be enabled once in repo Settings -> Pages with
        # "Build and deployment" Source set to "GitHub Actions".
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
